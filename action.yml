name: oss-steward
description: Run read-only oss-steward maintainer checks (health, digest, or notes)
author: oss-steward maintainers
branding:
  icon: shield
  color: green
inputs:
  command:
    description: Command to run (health, digest, or notes)
    required: false
    default: health
  root:
    description: Repository root to inspect
    required: false
    default: ${{ github.workspace }}
  token:
    description: GitHub token used only by digest
    required: false
    default: ${{ github.token }}
runs:
  using: composite
  steps:
    - name: Setup Node
      uses: actions/setup-node@v7
      with:
        node-version: "20"
        cache: npm
        cache-dependency-path: ${{ github.action_path }}/package-lock.json
    - name: Install and build
      shell: bash
      working-directory: ${{ github.action_path }}
      run: |
        npm ci
        npm run build
    - name: Run oss-steward
      shell: bash
      working-directory: ${{ inputs.root }}
      env:
        GITHUB_TOKEN: ${{ inputs.token }}
      run: node "${{ github.action_path }}/dist/cli.js" "${{ inputs.command }}" --root "${{ inputs.root }}"
