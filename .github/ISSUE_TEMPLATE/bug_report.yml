name: Bug report
description: Something in health, digest, notes, or MCP did not work
labels: ["bug"]
body:
  - type: textarea
    id: command
    attributes:
      label: Command
      description: The exact command you ran. Never paste a token.
      placeholder: npx oss-steward health --root .
    validations:
      required: true
  - type: input
    id: node
    attributes:
      label: Node.js version
      placeholder: v20.19.0
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual
    validations:
      required: true
